name: build_deploy

on:
  push:
    branches:
    - main
  pull_request:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v6

    - name: Build site
      run: |
        npm ci
        npm run build

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    - name: Build standards registry (mounted at /standards)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git clone -q --depth 1 https://github.com/enosema/standards.git /tmp/standards
        cd /tmp/standards
        npm ci
        bundle install --jobs 4
        bundle exec rake build
        mkdir -p "$GITHUB_WORKSPACE/dist/standards"
        cp -r dist/* "$GITHUB_WORKSPACE/dist/standards/"

        # Site-root convenience redirects into the /standards mount:
        # /docs/** and the data endpoints 301-equivalents (meta refresh)
        cd "$GITHUB_WORKSPACE/dist"
        stub() {
          local target="$1" dest="$2"
          mkdir -p "$(dirname "$dest")"
          printf '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>%s</title><link rel="canonical" href="%s"><meta http-equiv="refresh" content="0; url=%s"></head><body><p>Moved to <a href="%s">%s</a>.</p></body></html>\n' "$target" "$target" "$target" "$target" "$target" > "$dest"
        }
        find standards/docs -name '*.html' | while read -r f; do
          rel="${f#standards/}"
          stub "/standards/$rel" "$rel"
        done
        for ep in catalog.json catalog.json.sha256 search-index.json feed.xml opensearch.xml sitemap.xml; do
          [ -f "standards/$ep" ] && stub "/standards/$ep" "$ep"
        done

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
