name: build_deploy

on:
  push:
    branches:
    - main
  pull_request:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v6

    - name: Build site
      run: |
        npm ci
        npm run build

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    - name: Build standards registry (mounted at /standards)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git clone -q --depth 1 https://github.com/enosema/standards.git /tmp/standards
        cd /tmp/standards
        npm ci
        bundle install --jobs 4
        bundle exec rake build
        cp -r dist/* "$GITHUB_WORKSPACE/dist/standards/"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
